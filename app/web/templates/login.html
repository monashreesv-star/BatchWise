<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Sign In - BatchWise ERP</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 20%, #1E1B4B 0%, #0F172A 70%, #020617 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #F8FAFC;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .login-card {
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 480px;
        }

        .btn-persona {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #E2E8F0;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-persona:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .form-control {
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            background: rgba(2, 6, 23, 0.8);
            border-color: #6366F1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            color: #FFFFFF;
        }

        .btn-brand-login {
            background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.8rem;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
            transition: all 0.15s ease;
        }

        .btn-brand-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
        }
    </style>
</head>
<body>
    <div class="login-card p-4 p-md-5">
        <!-- Logo & Brand Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-4 bg-primary bg-opacity-25 border border-primary border-opacity-50 text-white mb-3 shadow-sm">
                <i class="bi bi-boxes fs-2"></i>
            </div>
            <h3 class="fw-bold text-white mb-1">BatchWise ERP</h3>
            <p class="text-white-50 small mb-0">Industrial Manufacturing Engine &bull; Karnataka [29]</p>
        </div>

        <!-- 1-Click Evaluator Quick Access Card -->
        <div class="p-3 rounded-4 mb-4" style="background: rgba(255, 255, 255, 0.04); border: 1px dashed rgba(255, 255, 255, 0.2);">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="text-uppercase fw-bold text-warning font-mono" style="font-size: 0.7rem;">
                    <i class="bi bi-lightning-charge-fill me-1"></i> Evaluator 1-Click Persona Access
                </span>
                <span class="badge bg-secondary font-mono" style="font-size: 0.6rem;">INSTANT LOGIN</span>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a href="/switch-role/admin" class="btn-persona text-danger border-danger border-opacity-50">
                    <i class="bi bi-shield-lock-fill"></i> Admin
                </a>
                <a href="/switch-role/salesman" class="btn-persona text-primary border-primary border-opacity-50">
                    <i class="bi bi-person-fill"></i> Salesman
                </a>
                <a href="/switch-role/purchase" class="btn-persona text-warning border-warning border-opacity-50">
                    <i class="bi bi-truck"></i> Purchase Mgr
                </a>
                <a href="/switch-role/production" class="btn-persona text-success border-success border-opacity-50">
                    <i class="bi bi-gear-fill"></i> Plant Mgr
                </a>
                <a href="/switch-role/auditor" class="btn-persona text-info border-info border-opacity-50">
                    <i class="bi bi-calculator-fill"></i> Auditor
                </a>
            </div>
        </div>

        <!-- Standard Login Form -->
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-white-50">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-white-50" style="border-color: rgba(255, 255, 255, 0.15);">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="username" class="form-control border-start-0 ps-0" value="admin" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-white-50">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-white-50" style="border-color: rgba(255, 255, 255, 0.15);">
                        <i class="bi bi-key"></i>
                    </span>
                    <input type="password" id="password" class="form-control border-start-0 ps-0" value="admin123" required>
                </div>
            </div>

            <button type="submit" class="btn btn-brand-login w-100 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-box-arrow-in-right"></i> Sign In to Operations Command
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-white border-opacity-10 text-white-50 small" style="font-size: 0.72rem;">
            Double-Entry Stock Ledger &bull; Conservation of Mass &bull; FIFO Depletion &bull; GST 29
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            Swal.showLoading();
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                Swal.fire({
                    icon: 'success',
                    title: 'Authenticated!',
                    text: `Signed in as ${data.user.full_name} (${data.user.role.toUpperCase()})`,
                    timer: 1000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = '/';
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Authentication Failed',
                    text: data.error || 'Invalid credentials'
                });
            }
        });
    </script>
</body>
</html>
