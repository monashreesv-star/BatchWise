<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BatchWise ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .login-card { border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); background: #ffffff; width: 100%; max-width: 480px; }
    </style>
</head>
<body>
    <div class="login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary"><i class="bi bi-boxes"></i> BatchWise ERP</h3>
            <p class="text-muted small">Industrial Batch Manufacturing, Costing & Traceability</p>
        </div>

        <div class="card bg-light border-0 p-3 mb-4">
            <h6 class="fw-bold text-dark mb-2" style="font-size: 0.85rem;"><i class="bi bi-lightning-charge-fill text-warning"></i> Evaluator Quick Access (1-Click)</h6>
            <div class="d-flex flex-wrap gap-2">
                <a href="/switch-role/admin" class="btn btn-sm btn-danger"><i class="bi bi-shield-lock"></i> Admin</a>
                <a href="/switch-role/salesman" class="btn btn-sm btn-primary"><i class="bi bi-person"></i> Salesman</a>
                <a href="/switch-role/purchase" class="btn btn-sm btn-warning text-dark"><i class="bi bi-truck"></i> Purchase</a>
                <a href="/switch-role/production" class="btn btn-sm btn-success"><i class="bi bi-gear"></i> Production</a>
                <a href="/switch-role/auditor" class="btn btn-sm btn-secondary" style="background-color: #7C3AED;"><i class="bi bi-calculator"></i> Auditor</a>
            </div>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username</label>
                <input type="text" id="username" class="form-control" value="admin" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" id="password" class="form-control" value="admin123" required>
            </div>
            <div id="errorAlert" class="alert alert-danger d-none py-2 small"></div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign In to Dashboard</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('errorAlert');
            err.classList.add('d-none');
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                window.location.href = '/';
            } else {
                err.textContent = data.error || 'Authentication failed';
                err.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
